<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キャリブレーション</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
a{color:#8FB3FF}a:hover{color:#B5CCFF}
@keyframes dk-ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.18);opacity:0}}
@keyframes dk-breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.06);opacity:0}}
@keyframes dk-fill{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}
.dk-ghost:hover{background:#222 !important}
</style>
</helmet>
<div style="width: 100%; min-height: 860px; box-sizing: border-box; background: #121212; color: #EDEDED; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 40px 40px">

  <div style="display: flex; align-items: center; gap: 16px">
    <div role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="4" aria-valuenow="{{doneSteps}}" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 520px; margin: 0 auto">
      <sc-for list="{{segments}}" as="sg" hint-placeholder-count="4">
        <span style="height: 4px; border-radius: 2px; background: {{sg.bg}}"></span>
      </sc-for>
    </div>
    <a href="DeskMap.dc.html" class="dk-ghost" aria-label="閉じる" title="閉じる" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 4.2L12 10.6l6.4-6.4 1.4 1.4-6.4 6.4 6.4 6.4-1.4 1.4-6.4-6.4-6.4 6.4-1.4-1.4 6.4-6.4-6.4-6.4z" fill="#BDBDBD"></path></svg>
    </a>
  </div>

  <section aria-label="机" style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding-top: 24px">
    <div style="position: relative">
      <div style="display: grid; grid-template-columns: repeat(2, 240px); grid-template-rows: repeat(2, 190px); gap: 16px; opacity: {{gridOpacity}}">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
          <button onClick="{{t.hit}}" disabled="{{t.disabled}}" aria-label="{{t.aria}}" style="position: relative; box-sizing: border-box; border: 0; border-radius: 36px; background: {{t.bg}}; color: #121212; font: inherit; cursor: {{t.cursor}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0">
            <sc-if value="{{t.isCurrent}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 36px; border: 3px solid #03AED2; animation: dk-breathe 1.8s ease-in-out infinite; pointer-events: none"></span>
              <sc-if value="{{t.fire}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 36px; border: 4px solid #FFFFFF; animation: dk-ripple .5s ease-out forwards; pointer-events: none"></span>
              </sc-if>
              <span style="display: flex; align-items: center; gap: 10px; height: 28px; pointer-events: none">
                <span style="font-size: 18px; font-weight: 700">{{t.verb}}</span>
              </span>
              <span style="display: flex; gap: 8px; pointer-events: none">
                <sc-for list="{{t.pips}}" as="pp" hint-placeholder-count="3"><span style="width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 2px solid #121212; background: {{pp.bg}}"></span></sc-for>
              </span>
            </sc-if>
            <sc-if value="{{t.isDone}}" hint-placeholder-val="{{ false }}">
              <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 16.6L4.6 12l-1.4 1.4 6 6L21 7.6l-1.4-1.4z" fill="#13D66A"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{isNoise}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
          <svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="48" fill="none" stroke="#2A2A2A" stroke-width="6"></circle><circle cx="55" cy="55" r="48" fill="none" stroke="#EDEDED" stroke-width="6" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="302" transform="rotate(-90 55 55)" style="animation: dk-fill 2s linear forwards"></circle><path d="M45 62V40a3 3 0 0 1 6 0v14V36a3 3 0 0 1 6 0v18V38a3 3 0 0 1 6 0v18-10a3 3 0 0 1 6 0v14a14 14 0 0 1-14 14h-1a12 12 0 0 1-9.6-4.8L37 58a3 3 0 0 1 4.6-3.8z" fill="#EDEDED" fill-opacity="0.9"></path><path d="M30 30l50 50" stroke="#121212" stroke-width="7" stroke-linecap="round"></path><path d="M30 30l50 50" stroke="#EDEDED" stroke-width="3" stroke-linecap="round"></path></svg>
          <span style="font-size: 15px; font-weight: 700">机に触れずに待つ</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; height: 56px">
      <sc-if value="{{isTap}}" hint-placeholder-val="{{ false }}">
        <button class="dk-ghost" onClick="{{undo}}" aria-label="1回戻す" title="1回戻す" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #1E1E1E; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 10l6 6v-4.5h6a4 4 0 0 1 0 8h-3V22h3a6.5 6.5 0 0 0 0-13H9z" fill="#BDBDBD"></path></svg>
        </button>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
        <button class="dk-ghost" onClick="{{restart}}" aria-label="やり直す" title="やり直す" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #1E1E1E; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 8 8h-2.2A5.8 5.8 0 1 1 12 6.2V9l4.5-4L12 1z" fill="#BDBDBD"></path></svg>
        </button>
        <a href="DeskMap.dc.html" aria-label="保存" title="保存" style="width: 160px; height: 52px; border-radius: 26px; background: #EDEDED; display: flex; align-items: center; justify-content: center; text-decoration: none">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 16.6L4.6 12l-1.4 1.4 6 6L21 7.6l-1.4-1.4z" fill="#121212"></path></svg>
        </a>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
const REGIONS = ['左上', '右上', '左下', '右下'];
const HITS = 3;

class Component extends DCLogic {
  componentDidMount() { this.startNoise(); }
  componentWillUnmount() { clearTimeout(this.noiseTimer); clearTimeout(this.fireTimer); }
  startNoise() {
    clearTimeout(this.noiseTimer);
    this.setState({ phase: 'noise', step: 0, hits: 0, fire: false });
    this.noiseTimer = setTimeout(() => this.setState({ phase: 'tap' }), 2000);
  }
  renderVals() {
    const s = this.state;
    const phase = s.phase || 'noise';
    const step = s.step ?? 0;
    const hits = s.hits ?? 0;
    const fire = !!s.fire;

    const hit = () => {
      const nextHits = hits + 1;
      const patch = nextHits >= HITS
        ? (step + 1 >= 4 ? { phase: 'done', step: 4, hits: 0 } : { step: step + 1, hits: 0 })
        : { hits: nextHits };
      clearTimeout(this.fireTimer);
      this.setState({ ...patch, fire: false }, () => {
        this.setState({ fire: true });
        this.fireTimer = setTimeout(() => this.setState({ fire: false }), 500);
      });
    };

    const tiles = REGIONS.map((name, r) => {
      const isCurrent = phase === 'tap' && step === r;
      const isDone = phase === 'done' || step > r;
      return {
        isCurrent, isDone,
        bg: isCurrent ? '#03AED2' : '#1A1A1A',
        cursor: isCurrent ? 'pointer' : 'default',
        disabled: !isCurrent,
        hit,
        fire: isCurrent && fire,
        verb: '叩く',
        aria: isCurrent ? `${name}を叩く（${hits}/${HITS}）` : name,
        pips: Array.from({ length: HITS }, (_, i) => ({ bg: i < hits ? '#121212' : 'transparent' }))
      };
    });

    const segments = Array.from({ length: 4 }, (_, i) => ({
      bg: phase === 'done' || i < step ? '#EDEDED' : (phase === 'tap' && i === step ? '#03AED2' : '#2A2A2A')
    }));

    return {
      tiles, segments,
      doneSteps: phase === 'done' ? 4 : step,
      isNoise: phase === 'noise', isTap: phase === 'tap', isDone: phase === 'done',
      gridOpacity: phase === 'noise' ? '0.15' : '1',
      undo: () => {
        if (hits > 0) this.setState({ hits: hits - 1 });
        else if (step > 0) this.setState({ step: step - 1, hits: HITS - 1 });
      },
      restart: () => this.startNoise()
    };
  }
}
</script>
</body>
</html>

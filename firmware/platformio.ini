[platformio]
default_envs = xiao_esp32s3

[embedded]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = bblanchon/ArduinoJson@6.21.5
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
test_ignore = *

[env:xiao_esp32s3]
extends = embedded
board = seeed_xiao_esp32s3
build_flags = ${embedded.build_flags} -D DESKAPI_BOARD_XIAO -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
extends = embedded
board = esp32dev
build_flags = ${embedded.build_flags} -D DESKAPI_BOARD_ESP32

[env:esp32s3]
extends = embedded
board = esp32-s3-devkitc-1
build_flags = ${embedded.build_flags} -D DESKAPI_BOARD_S3

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -std=c++17 -Wall -Wextra -Werror
